# ──────────────────────────────────────────────────────────────────────────────
# HookShot — orquestación con un solo comando:
#
#     docker compose up --build
#
# Levanta:
#   · postgres : base de datos PostgreSQL con volumen persistente.
#   · app      : HookShot (API + frontend) escuchando en http://localhost:3000
#
# Las variables sensibles tienen valores por defecto para desarrollo. En
# producción, sobreescríbelas con un archivo .env junto a este compose.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookshot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookshot}
      POSTGRES_DB: ${POSTGRES_DB:-hookshot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hookshot} -d ${POSTGRES_DB:-hookshot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Conmutamos a PostgreSQL para el despliegue.
      DB_CLIENT: pg
      DATABASE_URL: postgres://${POSTGRES_USER:-hookshot}:${POSTGRES_PASSWORD:-hookshot}@postgres:5432/${POSTGRES_DB:-hookshot}
      # CAMBIA este secreto en producción.
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion}
      JWT_EXPIRES: ${JWT_EXPIRES:-24h}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
